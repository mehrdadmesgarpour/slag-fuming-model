:root{
  --bg:#E8ECE9; --surface:#F7F8F6; --raised:#FFFFFF; --ink:#16201D; --muted:#58645F; --line:#C9D0CC; --soft:#DDE3DF;
  --zn:#2C6F92; --pb:#9C6F0C; --fe:#963C27; --cu:#B0672F; --gas:#3F7553; --warn:#963C27;
  --bath-hi:#F6BE4A; --bath-mid:#E0702A; --bath-lo:#8E2C14; --settled:#3A2A25; --fume:#FBFBF7; --shell:#2A3531;
  --font:"Barlow", "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif;
  --font-cond:"Barlow Semi Condensed", "Barlow", "Arial Narrow", system-ui, sans-serif;
  color-scheme: light;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1412; --surface:#151D1A; --raised:#1B2521; --ink:#E1E7E3; --muted:#939F9A; --line:#2B3632; --soft:#202A26;
    --zn:#74B5D6; --pb:#E3B64A; --fe:#DC7A60; --cu:#E39E62; --gas:#88BB97; --warn:#E58A70;
    --bath-hi:#F6BE4A; --bath-mid:#D9632A; --bath-lo:#7A2410; --settled:#0A0807; --fume:#ECEDE6; --shell:#B9C4BF;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1412; --surface:#151D1A; --raised:#1B2521; --ink:#E1E7E3; --muted:#939F9A; --line:#2B3632; --soft:#202A26;
  --zn:#74B5D6; --pb:#E3B64A; --fe:#DC7A60; --cu:#E39E62; --gas:#88BB97; --warn:#E58A70;
  --bath-hi:#F6BE4A; --bath-mid:#D9632A; --bath-lo:#7A2410; --settled:#0A0807; --fume:#ECEDE6; --shell:#B9C4BF;
  color-scheme: dark;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0; background:var(--bg); color:var(--ink); font-family:var(--font); font-size:15px; line-height:1.45; font-variant-numeric:tabular-nums; -webkit-text-size-adjust:100%}
sub{font-size:.72em; line-height:0; vertical-align:-.25em}
sup{font-size:.72em; line-height:0; vertical-align:.4em}
h1,h2,h3{font-family:var(--font-cond); font-weight:600; margin:0; letter-spacing:.005em}
button,input,select{font:inherit; color:inherit}
:focus-visible{outline:2px solid var(--zn); outline-offset:2px}

.app{display:grid; grid-template-columns:minmax(300px,390px) minmax(0,1fr); align-items:start; min-height:100%}
.inputs{background:var(--surface); border-right:1px solid var(--line); position:sticky; top:env(safe-area-inset-top,0px); max-height:calc(100vh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px)); overflow:auto; overscroll-behavior:contain}
.brand{padding:20px 20px 14px; border-bottom:1px solid var(--line)}
.brand h1{font-size:25px; line-height:1.1}
.brand p{margin:6px 0 0; color:var(--muted); font-size:13.5px; max-width:36ch}
.jump{display:none; margin-top:8px; font-size:14px; color:var(--zn)}

details.grp{border-bottom:1px solid var(--line)}
details.grp>summary{list-style:none; cursor:pointer; padding:13px 20px; font-family:var(--font-cond); font-weight:600; font-size:17px; display:flex; justify-content:space-between; align-items:baseline; gap:12px}
details.grp>summary::-webkit-details-marker{display:none}
details.grp>summary .hint{font-family:var(--font); font-weight:400; font-size:13px; color:var(--muted); white-space:nowrap}
details.grp>summary::after{content:"+"; font-family:var(--font); color:var(--muted); font-weight:400}
details.grp[open]>summary::after{content:"−"}
.grp-body{padding:0 20px 16px}
.field{display:grid; grid-template-columns:minmax(0,1fr) 92px 50px; align-items:center; gap:8px; margin:6px 0}
.field label{font-size:14px}
.field .unit{font-size:12.5px; color:var(--muted)}
input[type=number],select{width:100%; background:var(--raised); border:1px solid var(--line); border-radius:4px; padding:5px 7px; font-size:14px; text-align:right}
select{text-align:left}
input[type=number]:hover,select:hover{border-color:var(--muted)}
.subhead{font-size:13px; color:var(--muted); margin:14px 0 4px}
.cgrid{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); column-gap:14px}
.cgrid .field{grid-template-columns:minmax(0,1fr) 70px; margin:4px 0}
.note{font-size:13px; color:var(--muted); margin:8px 0 0}
.note strong{color:var(--ink); font-weight:600}
.assay{display:flex; flex-wrap:wrap; gap:4px 14px; font-size:13px; margin-top:8px}
.assay span b{font-weight:600}
.chk{display:flex; align-items:center; gap:8px; font-size:14px; margin:5px 0}
.chk input{width:16px; height:16px; accent-color:var(--zn)}
.gtable{width:100%; border-collapse:collapse; font-size:13.5px; margin-top:4px}
.gtable td{padding:2px 0}
.gtable td:first-child{color:var(--muted); width:84px}
.gtable input{max-width:76px}
.gcell{display:flex; align-items:center; gap:6px; justify-content:flex-end}
.linkbtn{background:none; border:0; padding:0; color:var(--zn); text-decoration:underline; text-underline-offset:2px; cursor:pointer; font-size:13px}

main{padding:22px clamp(16px,3vw,36px) 48px; min-width:0}
.topline{display:flex; justify-content:space-between; align-items:baseline; gap:16px; flex-wrap:wrap; margin-bottom:10px}
.topline h2{font-size:21px}
.status{font-size:13px; color:var(--muted)}
.status.err{color:var(--warn)}
.furnace{background:var(--surface); border:1px solid var(--line); border-radius:6px; padding:8px 10px 2px}
.furnace svg{display:block; width:100%; height:auto}
.furnace text{font-family:var(--font); fill:var(--ink)}
.kpis{display:grid; grid-template-columns:repeat(auto-fit,minmax(126px,1fr)); border:1px solid var(--line); border-top:0; border-radius:0 0 6px 6px; background:var(--raised)}
.kpi{padding:10px 14px; border-right:1px solid var(--soft)}
.kpi:last-child{border-right:0}
.kpi .v{font-family:var(--font-cond); font-weight:600; font-size:23px; line-height:1.15}
.kpi .l{font-size:12.5px; color:var(--muted)}
.furnace-wrap .furnace{border-radius:6px 6px 0 0}
.warnbox{margin-top:10px; border-left:3px solid var(--warn); padding:6px 10px; font-size:13.5px; background:var(--surface)}

.charts{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:14px; margin-top:22px}
.chart{background:var(--surface); border:1px solid var(--line); border-radius:6px; padding:10px 12px 6px}
.chart h3{font-size:16px}
.legend{display:flex; gap:12px; flex-wrap:wrap; font-size:12.5px; color:var(--muted); margin:2px 0 2px}
.legend i{display:inline-block; width:16px; height:0; border-top:2px solid; vertical-align:middle; margin-right:5px}
.legend i.d{border-top-style:dashed}
.chart svg{display:block; width:100%; height:auto; touch-action:pan-y}
.chart svg text{font-family:var(--font); font-size:11px; fill:var(--muted)}
.limit-toggle{margin-top:8px}

.tabs{margin-top:26px; border-bottom:1px solid var(--line); display:flex; gap:2px; overflow-x:auto}
.tab{background:none; border:0; border-bottom:2px solid transparent; padding:8px 10px; font-family:var(--font-cond); font-weight:600; font-size:15.5px; color:var(--muted); cursor:pointer; white-space:nowrap}
.tab[aria-selected=true]{color:var(--ink); border-bottom-color:var(--ink)}
.panel{padding-top:14px}
.panel[hidden]{display:none}
.scroll{overflow-x:auto}
table.data{border-collapse:collapse; width:100%; font-size:13.5px}
table.data th,table.data td{padding:5px 8px; border-bottom:1px solid var(--soft); text-align:right; white-space:nowrap}
table.data th{font-weight:600; color:var(--muted); font-size:12.5px; position:sticky; top:0; background:var(--bg)}
table.data td:first-child,table.data th:first-child{text-align:left}
table.data tr.grp td{background:var(--soft); color:var(--ink); font-weight:600; text-align:left; font-family:var(--font-cond); font-size:14.5px}
table.data td.l{text-align:left; white-space:normal}
.blocks{display:grid; grid-template-columns:repeat(auto-fit,minmax(280px,1fr)); gap:16px}
.block{background:var(--surface); border:1px solid var(--line); border-radius:6px; padding:12px 14px}
.block h3{font-size:16.5px; margin-bottom:2px}
.block .mass{font-size:13px; color:var(--muted); margin-bottom:6px}
.block table.data th{background:var(--surface)}
.block table.data td:first-child{white-space:normal}
table.data th.l{text-align:left}
.row{display:flex; gap:14px; align-items:center; flex-wrap:wrap; margin-bottom:12px; font-size:14px}
.row input[type=range]{width:min(360px,100%); accent-color:var(--zn)}
.row .field{margin:0; grid-template-columns:auto 96px; }
.btn{background:var(--ink); color:var(--bg); border:0; border-radius:4px; padding:7px 14px; font-weight:600; cursor:pointer}
.btn:hover{opacity:.9}
.prose{max-width:74ch; font-size:14.5px}
.calgrid{display:grid; grid-template-columns:minmax(0,1.1fr) minmax(0,1fr); gap:20px; align-items:start}
.calgrid textarea{width:100%; min-height:210px; font:inherit; font-size:14px; font-variant-numeric:tabular-nums; background:var(--raised); color:var(--ink); border:1px solid var(--line); border-radius:4px; padding:8px}
.calgrid label.top{display:block; font-size:14px; margin-bottom:6px}
.btnrow{display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-top:12px}
.btn.secondary{background:none; color:var(--ink); border:1px solid var(--line)}
.calstat{margin:14px 0 4px; font-size:14px}
.calcharts{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:14px; margin-top:10px}
@media (max-width: 1100px){ .calcharts{grid-template-columns:1fr} .calgrid{grid-template-columns:1fr} }
.prose h3{font-size:17px; margin:18px 0 4px}
.prose p{margin:6px 0}
.small{font-size:13px; color:var(--muted)}

@media (max-width: 900px){
  .app{grid-template-columns:1fr}
  .inputs{position:static; max-height:none; border-right:0; border-bottom:1px solid var(--line)}
  .charts{grid-template-columns:1fr}
  .jump{display:inline-block}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important; animation:none!important}}
</style>
</head>
<body>
<div class="app">
  <aside class="inputs" aria-label="Model inputs">
    <div class="brand">
      <h1>Slag fuming furnace</h1>
      <p>Gibbs energy minimisation of copper slag fuming with coal and aluminium. Results update as you edit.</p>
      <a class="jump" href="#results">See the results</a>
    </div>
    <div id="groups"></div>
  </aside>

  <main>
    <div class="topline" id="results">
      <h2>Fuming cycle result</h2>
      <div class="status" id="status" role="status" aria-live="polite">Calculating…</div>
    </div>
    <div class="furnace-wrap">
      <div class="furnace" id="furnace"></div>
      <div class="kpis" id="kpis"></div>
    </div>
    <div id="warn"></div>

    <div class="charts" id="charts"></div>
    <label class="chk limit-toggle"><input type="checkbox" id="showLimit" checked> Show the equilibrium limit (whole bath equilibrated in every step)</label>

    <div class="tabs" role="tablist" id="tabs">
      <button class="tab" role="tab" aria-selected="true" data-tab="steps">Step results</button>
      <button class="tab" role="tab" aria-selected="false" data-tab="phases">Products</button>
      <button class="tab" role="tab" aria-selected="false" data-tab="eq">Equilibrium detail</button>
      <button class="tab" role="tab" aria-selected="false" data-tab="rx">Reactions</button>
      <button class="tab" role="tab" aria-selected="false" data-tab="sens">Sensitivity</button>
      <button class="tab" role="tab" aria-selected="false" data-tab="cal">Calibrate to data</button>
      <button class="tab" role="tab" aria-selected="false" data-tab="data">Thermodynamic data</button>
      <button class="tab" role="tab" aria-selected="false" data-tab="about">How it works</button>
    </div>
    <section class="panel" id="p-steps"></section>
    <section class="panel" id="p-phases" hidden></section>
    <section class="panel" id="p-eq" hidden></section>
    <section class="panel" id="p-rx" hidden></section>
    <section class="panel" id="p-sens" hidden></section>
    <section class="panel" id="p-cal" hidden></section>
    <section class="panel" id="p-data" hidden></section>
    <section class="panel" id="p-about" hidden></section>
  </main>
</div>

  const OFFSET = {}; // user ΔG offsets, J/mol, per STD key

  function stdHG(key, T) {

  // ---------- species & phases ----------
  const PHASES = [

    { id: 'slag', label: 'Slag', type: 'sol' },
    { id: 'alloy', label: 'Iron alloy', type: 'sol' },
    { id: 'bullion', label: 'Cu–Pb bullion', type: 'sol' },
    { id: 'matte', label: 'Matte', type: 'sol' },
    { id: 'C(gr)', label: 'Graphite / char', type: 'pure' },
    { id: 'Fe3O4(s)', label: 'Magnetite (solid)', type: 'pure' },
    { id: 'MgAl2O4(s)', label: 'Spinel MgAl₂O₄', type: 'pure' },

  const SPECIES = [

    ['PbO(g)', 'gas', { Pb: 1, O: 1 }, 'PbO(g)'], ['PbS(g)', 'gas', { Pb: 1, S: 1 }, 'PbS(g)'], ['Cd(g)', 'gas', { Cd: 1 }, 'Cd(g)'],

    ['H2S', 'gas', { H: 2, S: 1 }, 'H2S(g)'], ['COS', 'gas', { C: 1, O: 1, S: 1 }, 'COS(g)'], ['SiO(g)', 'gas', { Si: 1, O: 1 }, 'SiO(g)'],
    ['FeO', 'slag', { Fe: 1, O: 1 }, 'FeO(l)'], ['FeO1.5', 'slag', { Fe: 1, O: 1.5 }, 'Fe2O3(s)', 0.5],
    ['SiO2', 'slag', { Si: 1, O: 2 }, 'SiO2'], ['CaO', 'slag', { Ca: 1, O: 1 }, 'CaO(s)'],
    ['AlO1.5', 'slag', { Al: 1, O: 1.5 }, 'Al2O3(s)', 0.5], ['MgO', 'slag', { Mg: 1, O: 1 }, 'MgO(s)'],
    ['ZnO', 'slag', { Zn: 1, O: 1 }, 'ZnO(s)'], ['PbO', 'slag', { Pb: 1, O: 1 }, 'PbO'],
    ['CuO0.5', 'slag', { Cu: 1, O: 0.5 }, 'Cu2O', 0.5], ['CdO', 'slag', { Cd: 1, O: 1 }, 'CdO(s)'],
    ['Fe', 'alloy', { Fe: 1 }, 'Fe'], ['Cu', 'alloy', { Cu: 1 }, 'Cu'], ['Si', 'alloy', { Si: 1 }, 'Si'],
    ['Al', 'alloy', { Al: 1 }, 'Al(l)'], ['Pb', 'alloy', { Pb: 1 }, 'Pb(l)'],
    ['Cu', 'bullion', { Cu: 1 }, 'Cu'], ['Pb', 'bullion', { Pb: 1 }, 'Pb(l)'], ['Fe', 'bullion', { Fe: 1 }, 'Fe'], ['Zn', 'bullion', { Zn: 1 }, 'Zn(l)'],
    ['FeS', 'matte', { Fe: 1, S: 1 }, 'FeS(l)'], ['Cu2S', 'matte', { Cu: 2, S: 1 }, 'Cu2S'],
    ['PbS', 'matte', { Pb: 1, S: 1 }, 'PbS(l)'], ['ZnS', 'matte', { Zn: 1, S: 1 }, 'ZnS(s)'],
    ['C', 'C(gr)', { C: 1 }, 'C(gr)'], ['Fe3O4', 'Fe3O4(s)', { Fe: 3, O: 4 }, 'Fe3O4(s)'],

    const f = s[2]; let mw = 0; for (const e in f) mw += f[e] * AW[e];

  });
  const SP = {}; SPECIES.forEach(s => { SP[s.key] = s; });
  const NS = SPECIES.length, NE = ELEMENTS.length;
  const A = ELEMENTS.map(e => SPECIES.map(s => s.f[e] || 0)); // A[j][i]
  const PH_IDX = {}; PHASES.forEach((p, k) => { PH_IDX[p.id] = k; p.sp = SPECIES.filter(s => s.ph === p.id).map(s => s.i); });
  SPECIES.forEach(s => { s.pk = PH_IDX[s.ph]; });

  const DEFAULT_GAMMA = {
    'slag:FeO': 1.0, 'slag:FeO1.5': 1.5, 'slag:SiO2': 1.0, 'slag:CaO': 1.0, 'slag:AlO1.5': 1.0, 'slag:MgO': 1.0,
    'slag:ZnO': 2.0, 'slag:PbO': 0.3, 'slag:CuO0.5': 3.5, 'slag:CdO': 1.0,
    'alloy:Fe': 1.0, 'alloy:Cu': 8.0, 'alloy:Si': 0.002, 'alloy:Al': 0.03, 'alloy:Pb': 200,
    'bullion:Cu': 1.0, 'bullion:Pb': 3.0, 'bullion:Fe': 25, 'bullion:Zn': 0.15,
    'matte:FeS': 1.0, 'matte:Cu2S': 1.0, 'matte:PbS': 1.0, 'matte:ZnS': 1.0
  };

  // g_i = mu_i°/RT + ln(gamma) (+ ln P for gas)
  function gVector(T, P, gamma, enabled) {
    const g = new Float64Array(NS), H = new Float64Array(NS);
    const cache = {};
    for (const s of SPECIES) {
      let r = cache[s.std]; if (!r) { r = stdHG(s.std, T); cache[s.std] = r; }
      g[s.i] = s.sc * r.G / (R * T);
      H[s.i] = s.sc * r.H;
      if (s.ph === 'gas') g[s.i] += Math.log(P);
      else if (gamma[s.key] != null) g[s.i] += Math.log(gamma[s.key]);
    }
    return { g, H, enabled };
  }

  // ---------- linear solver ----------
  function solveLin(M, b) {
    const n = b.length;
    for (let i = 0; i < n; i++) { // row equilibration
      let mx = Math.abs(b[i]) * 0; for (let j = 0; j < n; j++) mx = Math.max(mx, Math.abs(M[i][j]));
      if (mx > 0) { for (let j = 0; j < n; j++) M[i][j] /= mx; b[i] /= mx; }
    }
    for (let k = 0; k < n; k++) {
      let p = k, mv = Math.abs(M[k][k]);
      for (let i = k + 1; i < n; i++) { const v = Math.abs(M[i][k]); if (v > mv) { mv = v; p = i; } }
      if (mv < 1e-13) return null;
      if (p !== k) { const t = M[p]; M[p] = M[k]; M[k] = t; const tb = b[p]; b[p] = b[k]; b[k] = tb; }
      const piv = M[k][k];
      for (let i = k + 1; i < n; i++) {
        const fct = M[i][k] / piv; if (fct === 0) continue;
        const Mi = M[i], Mk = M[k];
        for (let j = k; j < n; j++) Mi[j] -= fct * Mk[j];
        b[i] -= fct * b[k];
      }
    }
    const x = new Float64Array(n);
    for (let i = n - 1; i >= 0; i--) { let s = b[i]; for (let j = i + 1; j < n; j++) s -= M[i][j] * x[j]; x[i] = s / M[i][i]; }
    return x;
  }

  // ---------- Gibbs energy minimisation (Gordon–McBride / RAND, multiphase) ----------
  // n0: initial species amounts (kmol), element-balanced; returns equilibrium state
  function equilibrate(n0, gv, opts) {
    opts = opts || {};
    const g = gv.g, enabled = gv.enabled;
    const b = new Float64Array(NE);
    for (let j = 0; j < NE; j++) { let s = 0; for (let i = 0; i < NS; i++) s += A[j][i] * n0[i]; b[j] = s; }
    let scale = 0; for (let j = 0; j < NE; j++) scale += b[j];
    const bs = b.map(v => v / scale);
    const elOn = []; for (let j = 0; j < NE; j++) if (bs[j] > 1e-15) elOn.push(j);
    const spOK = new Uint8Array(NS);
    for (const s of SPECIES) {
      let ok = enabled[s.ph] !== false;
      for (const e in s.f) { const j = ELEMENTS.indexOf(e); if (bs[j] <= 1e-15) ok = false; }
      spOK[s.i] = ok ? 1 : 0;
    }
    const n = new Float64Array(NS);
    for (let i = 0; i < NS; i++) n[i] = spOK[i] ? n0[i] / scale : 0;
    const active = PHASES.map((p) => p.sp.some(i => spOK[i] && n[i] > 0));
    active[PH_IDX.gas] = PHASES[PH_IDX.gas].sp.some(i => spOK[i]);
    active[PH_IDX.slag] = PHASES[PH_IDX.slag].sp.some(i => spOK[i]);
    // seed trace amounts for solution phases
    PHASES.forEach((p, k) => {
      if (p.type === 'pure' || !active[k]) return;
      let N = 0; p.sp.forEach(i => N += n[i]);
      if (N <= 0) N = 1e-6;
      p.sp.forEach(i => { if (spOK[i] && n[i] < 1e-12 * N) n[i] = 1e-12 * N; });
    });
    let pi = new Float64Array(NE), iterTot = 0, converged = false, phaseChanges = 0, lastAdded = -1;
    const maxIter = opts.maxIter || 600;
    const mu = new Float64Array(NS), dln = new Float64Array(NS);
    outer:
    for (let cycle = 0; cycle < 40; cycle++) {
      converged = false;
      for (let it = 0; it < maxIter; it++) {
        iterTot++;

        PHASES.forEach((p, k) => { if (!active[k]) return; if (p.type === 'pure') { if (spOK[p.sp[0]]) purePh.push(k); } else solPh.push(k); });
        const Nph = new Float64Array(PHASES.length);
        let Ntot = 0;
        for (const k of solPh) { let N = 0; for (const i of PHASES[k].sp) if (spOK[i]) N += n[i]; Nph[k] = N; Ntot += N; }
        for (const k of purePh) Ntot += n[PHASES[k].sp[0]];
        for (const k of solPh) for (const i of PHASES[k].sp) if (spOK[i]) mu[i] = g[i] + Math.log(n[i] / Nph[k]);
        const M = elOn.length, P = solPh.length, K = purePh.length, D = M + P + K;
        const Mat = []; for (let r = 0; r < D; r++) Mat.push(new Float64Array(D));
        const rhs = new Float64Array(D);
        for (let r = 0; r < M; r++) {
          const j = elOn[r];
          let tot = 0;
          for (const k of solPh) for (const i of PHASES[k].sp) {
            if (!spOK[i]) continue; const aji = A[j][i]; if (!aji) continue;
            const ni = n[i]; tot += aji * ni; rhs[r] += aji * ni * mu[i];
            for (let c = 0; c < M; c++) { const ali = A[elOn[c]][i]; if (ali) Mat[r][c] += aji * ali * ni; }
          }
          solPh.forEach((k, q) => { let s = 0; for (const i of PHASES[k].sp) if (spOK[i]) s += A[j][i] * n[i]; Mat[r][M + q] = s; });
          purePh.forEach((k, q) => { const i = PHASES[k].sp[0]; Mat[r][M + P + q] = A[j][i]; tot += A[j][i] * n[i]; });
          rhs[r] += bs[j] - tot;
        }
        solPh.forEach((k, q) => {
          const r = M + q;
          for (let c = 0; c < M; c++) { let s = 0; for (const i of PHASES[k].sp) if (spOK[i]) s += A[elOn[c]][i] * n[i]; Mat[r][c] = s; }
          let s = 0; for (const i of PHASES[k].sp) if (spOK[i]) s += n[i] * mu[i]; rhs[r] = s;
        });
        purePh.forEach((k, q) => {
          const r = M + P + q, i = PHASES[k].sp[0];
          for (let c = 0; c < M; c++) Mat[r][c] = A[elOn[c]][i];
          rhs[r] = g[i];
        });
        const x = solveLin(Mat, rhs);
        if (!x) {
          // singular: drop the last-added pure phase, or the smallest pure phase
          let drop = lastAdded >= 0 && active[lastAdded] && PHASES[lastAdded].type === 'pure' ? lastAdded : -1;
          if (drop < 0 && purePh.length) { drop = purePh.reduce((a, k) => n[PHASES[k].sp[0]] < n[PHASES[a].sp[0]] ? k : a, purePh[0]); }
          if (drop < 0) break outer;
          active[drop] = false; n[PHASES[drop].sp[0]] = 0; lastAdded = -1; continue;
        }
        pi = new Float64Array(NE); elOn.forEach((j, r) => { pi[j] = x[r]; });
        const u = new Float64Array(PHASES.length); solPh.forEach((k, q) => { u[k] = x[M + q]; });
        const dnp = new Float64Array(PHASES.length); purePh.forEach((k, q) => { dnp[k] = x[M + P + q]; });
        // corrections
        let lam1 = 1, lam2 = 1, maxBig = 0, err = 0;
        for (const k of solPh) {
          maxBig = Math.max(maxBig, Math.abs(u[k]));
          for (const i of PHASES[k].sp) {
            if (!spOK[i]) continue;
            let s = 0; for (const j of elOn) s += A[j][i] * pi[j];
            dln[i] = s + u[k] - mu[i];
            const xi = n[i] / Nph[k];
            if (xi > 1e-8) maxBig = Math.max(maxBig, Math.abs(dln[i]));
            else if (dln[i] - u[k] > 0) { const l = Math.abs((-Math.log(xi) - 9.2103) / (dln[i] - u[k])); lam2 = Math.min(lam2, l); }
            err = Math.max(err, n[i] * Math.abs(dln[i]) / Ntot);
          }
        }
        if (maxBig > 2) lam1 = 2 / maxBig;
        let lam = Math.min(1, lam1, lam2);
        let removePure = -1;
        for (const k of purePh) {
          const i = PHASES[k].sp[0];
          err = Math.max(err, Math.abs(dnp[k]) / Ntot);
          if (dnp[k] < 0 && n[i] + lam * dnp[k] <= 0) {
            const l = -n[i] / dnp[k];
            if (l < lam) { lam = l; removePure = k; }
          }
        }
        // element residual
        let res = 0;
        for (const j of elOn) { let s = 0; for (let i = 0; i < NS; i++) if (spOK[i] && active[SPECIES[i].pk]) s += A[j][i] * n[i]; res = Math.max(res, Math.abs(bs[j] - s)); }
        // update
        for (const k of solPh) for (const i of PHASES[k].sp) {
          if (!spOK[i]) continue;
          n[i] = Math.max(n[i] * Math.exp(Math.max(-700, Math.min(700, lam * dln[i]))), 1e-280);
        }
        for (const k of purePh) { const i = PHASES[k].sp[0]; n[i] = n[i] + lam * dnp[k]; if (k === removePure || n[i] < 0) { n[i] = 0; active[k] = false; } }
        // vanishing solution phases
        for (const k of solPh) {
          if (k === PH_IDX.slag || k === PH_IDX.gas) continue;
          let N = 0; for (const i of PHASES[k].sp) if (spOK[i]) N += n[i];
          if (N < 1e-13) { active[k] = false; for (const i of PHASES[k].sp) n[i] = 0; }
        }
        if (removePure >= 0) continue;
        if (err < 1e-11 && res < 1e-11 && lam > 0.99 && it > 0) { converged = true; break; }
      }
      if (!converged) break;
      // phase-stability tests
      let bestK = -1, bestD = -1e-8, bestType = '';
      PHASES.forEach((p, k) => {
        if (active[k]) return;
        const ids = p.sp.filter(i => spOK[i]); if (!ids.length) return;
        if (p.type === 'pure') {
          const i = ids[0]; let s = 0; for (const j of elOn) s += A[j][i] * pi[j];
          const d = g[i] - s; // <0 : should precipitate
          if (d < bestD) { bestD = d; bestK = k; bestType = 'pure'; }
        } else {
          let S = 0; for (const i of ids) { let s = 0; for (const j of elOn) s += A[j][i] * pi[j]; S += Math.exp(Math.min(700, s - g[i])); }
          const d = -Math.log(S); // <0 : phase stable
          if (d < bestD) { bestD = d; bestK = k; bestType = 'sol'; }
        }
      });
      if (bestK < 0) break;
      phaseChanges++;
      if (phaseChanges > 30) break;
      active[bestK] = true; lastAdded = bestK;
      const p = PHASES[bestK];
      if (bestType === 'pure') { n[p.sp[0]] = 0; }
      else {
        const ids = p.sp.filter(i => spOK[i]); let S = 0; const w = {};
        for (const i of ids) { let s = 0; for (const j of elOn) s += A[j][i] * pi[j]; w[i] = Math.exp(Math.min(700, s - g[i])); S += w[i]; }
        for (const i of ids) n[i] = 1e-7 * w[i] / S;
      }
    }
    const out = new Float64Array(NS);
    for (let i = 0; i < NS; i++) out[i] = (spOK[i] && active[SPECIES[i].pk]) ? n[i] * scale : 0;
    return { n: out, pi, active: active.slice(), converged, iter: iterTot };
  }

  // ---------- helpers ----------
  function phaseSum(n, ph, fn) { let s = 0; for (const i of PHASES[PH_IDX[ph]].sp) s += fn ? fn(SPECIES[i], n[i]) : n[i]; return s; }
  function phaseMass(n, ph) { return phaseSum(n, ph, (s, v) => s.mw * v); }
  function elementIn(n, el, ph) { let s = 0; for (const sp of SPECIES) { if (ph && sp.ph !== ph) continue; if (sp.f[el]) s += sp.f[el] * n[sp.i]; } return s; }
  function addInto(n, key, v) { n[SP[key].i] += v; }

  const MWOX = { FeO: 71.844, Fe3O4: 231.533, Fe2O3: 159.687, SiO2: 60.083, CaO: 56.077, Al2O3: 101.961, MgO: 40.304, ZnO: 81.379, PbO: 223.199, Cu2O: 143.091, Cu2S: 159.152, FeS: 87.905, CdO: 128.413 };
  const HF298 = { 'H2O(l)': -285830, SiO2: -910700, Al2O3: -1675700, CaO: -635090, Fe2O3: -824200, ZnO: -350460, PbO: -219000, CdO: -258350 };

  function slagToSpecies(massKg, comp) {
    const n = new Float64Array(NS);
    let sum = 0; for (const k in comp) sum += comp[k] || 0;

    gFeO15: { label: 'γ FeO1.5', get: c => (c.gamma && c.gamma['slag:FeO1.5']) || 1.5, set: (c, v) => { c.gamma = c.gamma || {}; c.gamma['slag:FeO1.5'] = v; }, lo: 0.1, hi: 20 }
  };
  function interp(ts, ys, t) {
    if (t <= ts[0]) return ys[0];
    for (let i = 1; i < ts.length; i++) if (t <= ts[i]) { const f = (t - ts[i - 1]) / (ts[i] - ts[i - 1]); return ys[i - 1] + f * (ys[i] - ys[i - 1]); }
    return ys[ys.length - 1];
  }
  // data: [{t, zn, pb}] (pb may be null). Returns objective and diagnostics.
  function evaluate(E, cfg, data, wPb) {
    const r = E.simulate(cfg, false);
    const f0 = r.feed, m0 = E.phaseMass(f0, 'slag');
    const zn0 = 100 * E.elementIn(f0, 'Zn', 'slag') * E.AW.Zn / m0, pb0 = 100 * E.elementIn(f0, 'Pb', 'slag') * E.AW.Pb / m0;
    const ts = [0].concat(r.steps.map(s => s.t)), zn = [zn0].concat(r.steps.map(s => s.Zn_slag)), pb = [pb0].concat(r.steps.map(s => s.Pb_slag));
    let J = 0, n = 0, sZn = 0, nZn = 0, sPb = 0, nPb = 0; const res = [];
    const scaleZn = Math.max(...data.map(d => d.zn).filter(v => v != null), 1e-6);
    const pbs = data.map(d => d.pb).filter(v => v != null), scalePb = pbs.length ? Math.max(...pbs, 1e-6) : 1;
    for (const d of data) {
      if (d.zn != null) { const e = interp(ts, zn, d.t) - d.zn; J += (e / scaleZn) ** 2; n++; sZn += e * e; nZn++; res.push(e / scaleZn); }
      if (d.pb != null && wPb > 0) { const e = interp(ts, pb, d.t) - d.pb; J += wPb * (e / scalePb) ** 2; n++; sPb += e * e; nPb++; res.push(Math.sqrt(wPb) * e / scalePb); }
    }
    return { res, J: n ? J / n : 0, rmseZn: nZn ? Math.sqrt(sZn / nZn) : NaN, rmsePb: nPb ? Math.sqrt(sPb / nPb) : NaN, curve: { ts, zn, pb }, unconv: r.summary.unconverged, summary: r.summary };
  }
  function makeCalibrator(E, baseCfg, data, keys, opts) {
    opts = opts || {};
    const wPb = opts.wPb != null ? opts.wPb : 1;
    const clone = o => JSON.parse(JSON.stringify(o));
    const specs = keys.map(k => PARAMS[k]);
    const toCfg = x => { const c = clone(baseCfg); specs.forEach((s, i) => s.set(c, Math.min(s.hi, Math.max(s.lo, Math.exp(x[i]))))); return c; };
    let evals = 0;
    const f = x => {
      evals++;
      let pen = 0; specs.forEach((s, i) => { const p = Math.exp(x[i]); if (p < s.lo) pen += Math.log(s.lo / p) ** 2; if (p > s.hi) pen += Math.log(p / s.hi) ** 2; });
      const ev = evaluate(E, toCfg(x), data, wPb); return { v: ev.J + 10 * pen, ev };
    };
    const x0 = specs.map(s => Math.log(s.get(baseCfg)));
    const n = x0.length, step = opts.step || 0.35;
    let S = [x0.slice()]; for (let i = 0; i < n; i++) { const x = x0.slice(); x[i] += step; S.push(x); }
    let F = S.map(x => f(x));
    const start = F[0];
    const hist = [{ iter: 0, J: F[0].v, p: x0.map(Math.exp) }];
    let iter = 0;
    function order() { const idx = S.map((_, i) => i).sort((a, b) => F[a].v - F[b].v); S = idx.map(i => S[i]); F = idx.map(i => F[i]); }
    order();
    function stepNM() {
      iter++;
      const c = new Array(n).fill(0); for (let i = 0; i < n; i++) for (let j = 0; j < n; j++) c[j] += S[i][j] / n;
      const w = S[n], lin = (a, b, t) => a.map((v, j) => v + t * (b[j] - v)); // a + t(b-a)
      const xr = lin(c, w, -1), fr = f(xr);
      if (fr.v < F[0].v) {
        const xe = lin(c, w, -2), fe = f(xe);
        if (fe.v < fr.v) { S[n] = xe; F[n] = fe; } else { S[n] = xr; F[n] = fr; }
      } else if (fr.v < F[n - 1].v) { S[n] = xr; F[n] = fr; }
      else {
        const outside = fr.v < F[n].v;
        const xc = outside ? lin(c, xr, 0.5) : lin(c, w, 0.5), fc = f(xc);
        if (fc.v < (outside ? fr.v : F[n].v)) { S[n] = xc; F[n] = fc; }
        else { for (let i = 1; i <= n; i++) { S[i] = lin(S[0], S[i], 0.5); F[i] = f(S[i]); } }
      }
      order();
      hist.push({ iter, J: F[0].v, p: S[0].map(Math.exp) });
      return state();
    }
    function state() {
      const best = F[0].ev, pBest = S[0].map((v, i) => Math.min(specs[i].hi, Math.max(specs[i].lo, Math.exp(v))));
      const spread = Math.max(...F.map(z => z.v)) - F[0].v;
      return { iter, evals, J: F[0].v, J0: start.v, rmseZn: best.rmseZn, rmsePb: best.rmsePb, rmseZn0: start.ev.rmseZn, rmsePb0: start.ev.rmsePb, params: keys.map((k, i) => ({ key: k, label: specs[i].label, start: Math.exp(x0[i]), value: pBest[i] })), curve: best.curve, startCurve: start.ev.curve, summary: best.summary, history: hist, spread, cfg: toCfg(S[0]) };
    }
    return { step: stepNM, state, keys };
  }
  // Linearised 1-sigma uncertainty and correlations of the fitted (log) parameters
  function uncertainty(E, cfg, data, keys, wPb) {
    const clone = o => JSON.parse(JSON.stringify(o));
    const specs = keys.map(k => PARAMS[k]);
    const r0 = evaluate(E, cfg, data, wPb).res, m = r0.length, n = keys.length, h = 0.03;
    const Jm = [];
    for (let i = 0; i < n; i++) {
      const c = clone(cfg); specs[i].set(c, specs[i].get(cfg) * Math.exp(h));
      const r1 = evaluate(E, c, data, wPb).res; Jm.push(r1.map((v, k) => (v - r0[k]) / h));
    }
    const A = []; for (let i = 0; i < n; i++) { A.push([]); for (let j = 0; j < n; j++) { let s = 0; for (let k = 0; k < m; k++) s += Jm[i][k] * Jm[j][k]; A[i].push(s); } }
    // invert A (Gauss-Jordan)
    const M = A.map((row, i) => row.concat(Array.from({ length: n }, (_, j) => (i === j ? 1 : 0))));
    for (let c = 0; c < n; c++) {
      let p = c; for (let r = c + 1; r < n; r++) if (Math.abs(M[r][c]) > Math.abs(M[p][c])) p = r;
      if (Math.abs(M[p][c]) < 1e-14) return { singular: true };
      [M[c], M[p]] = [M[p], M[c]]; const d = M[c][c]; for (let j = 0; j < 2 * n; j++) M[c][j] /= d;
      for (let r = 0; r < n; r++) if (r !== c) { const fct = M[r][c]; for (let j = 0; j < 2 * n; j++) M[r][j] -= fct * M[c][j]; }
    }
    const inv = M.map(row => row.slice(n));
    let ss = 0; r0.forEach(v => { ss += v * v; }); const s2 = ss / Math.max(1, m - n);
    const sd = inv.map((row, i) => Math.sqrt(Math.max(0, s2 * row[i])));
    const corr = inv.map((row, i) => row.map((v, j) => (s2 * v) / (sd[i] * sd[j] || 1)));
    return { singular: false, relErr: sd.map(v => Math.exp(v) - 1), corr, dof: m - n };
  }

<script>
(function(){

const STORE_KEY = 'slag-fuming-model-v1';

const DEFAULTS = {
  slag_t:50, flux_CaO_kg:0,
  slag:{FeO:42.05,Fe3O4:8,SiO2:30,CaO:3,Al2O3:4,MgO:1.5,ZnO:8,PbO:1.2,Cu2O:0.6,Cu2S:0.6,FeS:1.0,CdO:0.05},
  coal_kg_min:80, air_Nm3_min:350, o2_pct:21,
  coal:{C:72,H:4.5,O:8,N:1.5,S:0.8,H2O:3,ash:10.2}, ash:{SiO2:55,Al2O3:30,CaO:8,Fe2O3:7},

  T_C:1250, P:1, cycle_min:120, steps:24,
  turnover_pct_min:2.5, coal_util:90, ab_excess:20,
  gamma:Object.assign({}, E.DEFAULT_GAMMA),

};
const clone = o => JSON.parse(JSON.stringify(o));
function load(){
  try{ const s = localStorage.getItem(STORE_KEY); if(!s) return null; const o = JSON.parse(s);
    const d = clone(DEFAULTS);
    for (const k in d){ if (o[k]==null) continue; if (typeof d[k]==='object' && !Array.isArray(d[k])) Object.assign(d[k], o[k]); else d[k]=o[k]; }
    return d; }catch(e){ return null; }
}
function save(){ try{ localStorage.setItem(STORE_KEY, JSON.stringify(cfg)); }catch(e){} }
let cfg = load() || clone(DEFAULTS);

// ---------- formatting ----------
const F = (v,d=2)=> (v==null||!isFinite(v)) ? '–' : Number(v).toLocaleString('en-GB',{minimumFractionDigits:d,maximumFractionDigits:d});
const F0 = v => F(v,0);
const SUBS = {'₀':'0','₁':'1','₂':'2','₃':'3','₄':'4','₅':'5','₆':'6','₇':'7','₈':'8','₉':'9'};
const uniSub = s => s.replace(/[₀-₉]+/g, m => '<sub>'+[...m].map(c=>SUBS[c]).join('')+'</sub>');
const fx = s => String(s).replace(/([A-Za-z\)\]])(\d+(?:\.\d+)?)/g,'$1<sub>$2</sub>');
const esc = s => String(s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function sci(v){ if(!isFinite(v)||v<=0) return '0'; if (v>=0.01 && v<1e4) return F(v, v<1?4:2); const e=Math.floor(Math.log10(v)); const m=v/Math.pow(10,e); return m.toFixed(2)+'×10<sup>'+e+'</sup>'; }

// ---------- input groups ----------
const SLAG_KEYS = ['FeO','Fe3O4','SiO2','CaO','Al2O3','MgO','ZnO','PbO','Cu2O','Cu2S','FeS','CdO'];

const GAMMA_GROUPS = [['slag','Slag (cation-fraction basis)'],['alloy','Iron alloy'],['bullion','Cu–Pb bullion'],['matte','Matte']];
const PHASE_LABELS = [['matte','Matte (Cu₂S–FeS–PbS–ZnS)'],['alloy','Iron alloy (Fe–Cu–Si–Al–Pb)'],['bullion','Cu–Pb bullion (Cu–Pb–Fe–Zn)'],['C(gr)','Unburnt char (graphite)'],['Fe3O4(s)','Solid magnetite'],['MgAl2O4(s)','Spinel MgAl₂O₄'],['ZnAl2O4(s)','Gahnite ZnAl₂O₄']];

function numField(path, label, unit, step, min, max){
  return `<div class="field"><label for="in-${path}">${label}</label><input type="number" id="in-${path}" data-k="${path}" step="${step||'any'}" ${min!=null?'min="'+min+'"':''} ${max!=null?'max="'+max+'"':''}><span class="unit">${unit||''}</span></div>`;
}
function buildGroups(){
  const h = [];
  h.push(`<details class="grp" open><summary>Slag charge <span class="hint" id="h-slag"></span></summary><div class="grp-body">
    ${numField('slag_t','Slag in furnace','t',1,0.1)}
    ${numField('flux_CaO_kg','Lime flux (CaO)','kg',50,0)}
    <div class="subhead">Slag analysis, wt% (normalised to 100)</div>
    <div class="cgrid">${SLAG_KEYS.map(k=>`<div class="field"><label for="in-slag|${k}">${fx(k)}</label><input type="number" id="in-slag|${k}" data-k="slag|${k}" step="0.05" min="0"></div>`).join('')}</div>
    <div class="assay" id="assay"></div>
  </div></details>`);
  h.push(`<details class="grp" open><summary>Coal and blast <span class="hint" id="h-blast"></span></summary><div class="grp-body">
    ${numField('coal_kg_min','Coal injection','kg/min',1,0)}
    ${numField('air_Nm3_min','Blast air','Nm³/min',5,0)}
    ${numField('o2_pct','Oxygen in blast','vol%',0.5,21,100)}
    <p class="note" id="stoich"></p>
    <div class="subhead">Coal analysis, wt% as fired</div>
    <div class="cgrid">${COAL_KEYS.map(([k,l])=>`<div class="field"><label for="in-coal|${k}">${l}</label><input type="number" id="in-coal|${k}" data-k="coal|${k}" step="0.1" min="0"></div>`).join('')}</div>
    <div class="subhead">Ash composition, wt% (goes to slag)</div>
    <div class="cgrid">${ASH_KEYS.map(k=>`<div class="field"><label for="in-ash|${k}">${fx(k)}</label><input type="number" id="in-ash|${k}" data-k="ash|${k}" step="1" min="0"></div>`).join('')}</div>
  </div></details>`);
  h.push(`<details class="grp" open><summary>Aluminium reductant <span class="hint" id="h-al"></span></summary><div class="grp-body">
    ${numField('al_kg','Aluminium per cycle','kg',50,0)}
    ${numField('al_purity','Metallic Al (rest Al₂O₃)','%',1,0,100)}

    <p class="note">Scrap or granules with 90–99% Al; dross is often 40–70% metallic Al.</p>
  </div></details>`);
  h.push(`<details class="grp"><summary>Bath and cycle <span class="hint" id="h-bath"></span></summary><div class="grp-body">
    ${numField('T_C','Bath temperature','°C',5,1100,1450)}
    ${numField('P','Total pressure','atm',0.05,0.2,3)}
    ${numField('cycle_min','Blowing time','min',5,5)}
    ${numField('steps','Calculation steps','',1,1,200)}
  </div></details>`);
  h.push(`<details class="grp"><summary>Model calibration <span class="hint">fit to plant data</span></summary><div class="grp-body">
    ${numField('turnover_pct_min','Bath turnover through reaction zone','%/min',0.1,0.05,100)}
    ${numField('coal_util','Coal reacting in the bath','%',1,1,100)}
    ${numField('ab_excess','Excess tertiary air','%',5,0)}
    <p class="note">Turnover sets how fast slag passes through the tuyere zone, where it reaches equilibrium with the coal–air jet. Raise it until the predicted zinc curve matches your plant samples. The dashed curves show the limit at 100% per step.</p>

    ${GAMMA_GROUPS.map(([ph,lab])=>{
      const keys = Object.keys(E.DEFAULT_GAMMA).filter(k=>k.startsWith(ph+':'));
      return `<div class="small" style="margin-top:8px">${lab}</div><table class="gtable"><tbody>${keys.map(k=>`<tr><td><label for="in-gamma|${k}">${fx(k.split(':')[1])}</label></td><td><div class="gcell"><input type="number" id="in-gamma|${k}" data-k="gamma|${k}" step="any" min="0.0001"></div></td></tr>`).join('')}</tbody></table>`;
    }).join('')}

    <p class="note"><button class="linkbtn" id="resetAll" type="button">Reset every input to the defaults</button></p>
  </div></details>`);
  document.getElementById('groups').innerHTML = h.join('');
}

function getPath(p){ const [a,b] = p.split('|'); return b==null ? cfg[a] : (cfg[a]||{})[b]; }
function setPath(p,v){ const [a,b] = p.split('|'); if (b==null) cfg[a]=v; else { cfg[a] = cfg[a]||{}; cfg[a][b]=v; } }
function syncInputs(){
  document.querySelectorAll('[data-k]').forEach(el=>{
    const v = getPath(el.dataset.k);
    if (el.type==='checkbox') el.checked = v!==false;
    else el.value = v==null ? '' : v;
  });
}
function bindInputs(){
  document.getElementById('groups').addEventListener('input', e=>{
    const el = e.target; if (!el.dataset || !el.dataset.k) return;
    if (el.type==='checkbox') setPath(el.dataset.k, el.checked);
    else if (el.tagName==='SELECT') setPath(el.dataset.k, el.value);
    else { const v = parseFloat(el.value); if (!isFinite(v)) return; setPath(el.dataset.k, v); }
    save(); updateHints(); schedule();
  });
  document.getElementById('resetGamma').addEventListener('click', ()=>{ cfg.gamma = Object.assign({}, E.DEFAULT_GAMMA); syncInputs(); save(); schedule(); });
  document.getElementById('resetAll').addEventListener('click', ()=>{ cfg = clone(DEFAULTS); syncInputs(); save(); updateHints(); schedule(); });
}

// ---------- derived input info ----------
function stoichAirPerKg(){
  const c=cfg.coal; const o2 = c.C/100/12.011 + c.H/100/4.032 + c.S/100/32.06 - c.O/100/31.998; // kmol O2 / kg
  return o2*22.414/(cfg.o2_pct/100);
}
function updateHints(){
  const s=cfg.slag; let sum=0; SLAG_KEYS.forEach(k=>sum+=(s[k]||0));
  const w = k => (s[k]||0)/ (sum||1);
  const MW = E.MWOX;
  const Zn = 100*w('ZnO')*65.38/MW.ZnO, Pb = 100*w('PbO')*207.2/MW.PbO;
  const Cu = 100*(w('Cu2O')*2*63.546/MW.Cu2O + w('Cu2S')*2*63.546/MW.Cu2S);
  const Fe = 100*(w('FeO')*55.845/MW.FeO + w('Fe3O4')*3*55.845/MW.Fe3O4 + w('FeS')*55.845/MW.FeS);
  const S = 100*(w('Cu2S')*32.06/MW.Cu2S + w('FeS')*32.06/MW.FeS);
  document.getElementById('assay').innerHTML = `<span>Sum <b>${F(sum,2)}</b></span><span>Zn <b>${F(Zn,2)}%</b></span><span>Pb <b>${F(Pb,2)}%</b></span><span>Cu <b>${F(Cu,2)}%</b></span><span>Fe <b>${F(Fe,1)}%</b></span><span>S <b>${F(S,2)}%</b></span>`;
  document.getElementById('h-slag').textContent = `${F(cfg.slag_t,1)} t, ${F(Zn,1)}% Zn`;
  const stoich = stoichAirPerKg()*cfg.coal_kg_min;
  const ratio = stoich>0 ? 100*cfg.air_Nm3_min/stoich : 0;
  document.getElementById('h-blast').textContent = `${F0(ratio)}% of stoichiometric`;
  let msg = `The blast supplies <strong>${F0(ratio)}%</strong> of the air needed to burn the coal completely (${F0(stoich)} Nm³/min).`;
  if (ratio>=100) msg += ' The bath is oxidising at this ratio, so little or no zinc will fume.';
  else if (ratio<45) msg += ' Very reducing: expect metallic iron to form.';
  document.getElementById('stoich').innerHTML = msg;
  document.getElementById('h-al').textContent = cfg.al_kg>0 ? `${F0(cfg.al_kg)} kg` : 'none';
  document.getElementById('h-bath').textContent = `${F0(cfg.T_C)} °C, ${F0(cfg.cycle_min)} min`;
}

// ---------- charts ----------
function niceTicks(min,max,n){
  if (max<=min) max=min+1;
  const span=max-min, step0=span/n, mag=Math.pow(10,Math.floor(Math.log10(step0)));
  const err=step0/mag; const step = (err>=7.5?10:err>=3.5?5:err>=1.5?2:1)*mag;
  const lo=Math.floor(min/step)*step, hi=Math.ceil(max/step)*step; const t=[];
  for(let v=lo; v<=hi+step*1e-6; v+=step) t.push(+v.toPrecision(10));
  return t;
}
function drawChart(host, o){
  const W=380,H=210, ml=46, mr=20, mt=12, mb=34;
  const all = o.series.flatMap(s=>s.pts);
  if (!all.length){ host.innerHTML=''; return; }
  let xmin=Math.min(...all.map(p=>p[0])), xmax=Math.max(...all.map(p=>p[0]));
  if (o.x0!=null) xmin=Math.min(xmin,o.x0);
  let ymin = o.ymin!=null ? o.ymin : Math.min(...all.map(p=>p[1]));
  let ymax = Math.max(...all.map(p=>p[1]));
  if (o.ymin==null && ymin===ymax){ ymin-=1; ymax+=1; }
  const yt = niceTicks(ymin, ymax, 4), xt = niceTicks(xmin, xmax, 5);
  ymin=yt[0]; ymax=yt[yt.length-1]; xmin=Math.min(xmin,xt[0]); xmax=Math.max(xmax,xt[xt.length-1]);
  const X=v=>ml+(v-xmin)/(xmax-xmin)*(W-ml-mr), Y=v=>mt+(1-(v-ymin)/(ymax-ymin))*(H-mt-mb);
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.title)}">`;
  yt.forEach(v=>{ s+=`<line x1="${ml}" x2="${W-mr}" y1="${Y(v)}" y2="${Y(v)}" style="stroke:var(--soft)"/><text x="${ml-6}" y="${Y(v)+3.5}" text-anchor="end">${o.fy?o.fy(v):v}</text>`; });
  xt.forEach(v=>{ if(v<xmin-1e-9||v>xmax+1e-9) return; s+=`<text x="${X(v)}" y="${H-mb+15}" text-anchor="middle">${v}</text>`; });
  s+=`<line x1="${ml}" x2="${W-mr}" y1="${H-mb}" y2="${H-mb}" style="stroke:var(--muted)"/>`;
  s+=`<text x="${(ml+W-mr)/2}" y="${H-4}" text-anchor="middle">${esc(o.xlab)}</text>`;
  o.series.forEach(se=>{
    if (se.markers){ se.pts.forEach(p=>{ s+=`<circle cx="${X(p[0]).toFixed(1)}" cy="${Y(p[1]).toFixed(1)}" r="3.6" style="fill:var(--surface);stroke:${se.color};stroke-width:1.8"/>`; }); return; }
    const d = se.pts.map((p,i)=>(i?'L':'M')+X(p[0]).toFixed(1)+' '+Y(p[1]).toFixed(1)).join('');
    s+=`<path d="${d}" style="fill:none;stroke:${se.color};stroke-width:${se.dash?1.6:2.2};${se.dash?'stroke-dasharray:5 4;':''}stroke-linejoin:round"/>`;
  });
  s+=`<line class="hx" x1="0" x2="0" y1="${mt}" y2="${H-mb}" style="stroke:var(--muted);stroke-width:1;visibility:hidden"/>`;
  s+=`<text class="ht" x="${ml+6}" y="${mt+10}" style="fill:var(--ink);font-size:11.5px;visibility:hidden"></text>`;
  s+=`<rect x="${ml}" y="${mt}" width="${W-ml-mr}" height="${H-mt-mb}" style="fill:transparent"/></svg>`;
  host.innerHTML = `<h3>${o.title}</h3><div class="legend">${o.series.map(se=>se.markers?`<span><b style="display:inline-block;width:9px;height:9px;border:1.8px solid ${se.color};border-radius:50%;vertical-align:middle;margin-right:5px"></b>${esc(se.name)}</span>`:`<span><i class="${se.dash?'d':''}" style="border-color:${se.color}"></i>${esc(se.name)}</span>`).join('')}</div>${s}`;
  const svg=host.querySelector('svg'), hx=svg.querySelector('.hx'), ht=svg.querySelector('.ht'), base=(o.series.find(se=>!se.markers)||o.series[0]).pts;
  function move(ev){
    const r=svg.getBoundingClientRect(); const px=(ev.clientX-r.left)/r.width*W;
    const xv = xmin+(px-ml)/(W-ml-mr)*(xmax-xmin);
    let bi=0,bd=1e18; base.forEach((p,i)=>{const d=Math.abs(p[0]-xv); if(d<bd){bd=d;bi=i;}});
    const xp=X(base[bi][0]); hx.setAttribute('x1',xp); hx.setAttribute('x2',xp); hx.style.visibility='visible';
    const txt = `${o.xname||'x'} ${base[bi][0]}: ` + o.series.filter(se=>!se.markers).map(se=>{const p=se.pts[bi]; return p? `${se.short||se.name} ${o.fv?o.fv(p[1]):F(p[1],2)}`:'';}).filter(Boolean).join(', ');
    ht.textContent=txt; ht.style.visibility='visible';
  }
  svg.addEventListener('pointermove',move); svg.addEventListener('pointerleave',()=>{hx.style.visibility='hidden'; ht.style.visibility='hidden';});
}

// ---------- run ----------
let timer=null, lastRes=null, lastLim=null, eqStep=null;
function schedule(){ clearTimeout(timer); setStatus('Calculating…'); timer=setTimeout(runNow, 220); }
function setStatus(t,err){ const el=document.getElementById('status'); el.textContent=t; el.className='status'+(err?' err':''); }
function validate(){
  let s=0; SLAG_KEYS.forEach(k=>s+=(cfg.slag[k]||0));
  if (s<=0) return 'Enter a slag analysis: the oxide percentages add up to zero.';
  if (!(cfg.slag_t>0)) return 'Enter a slag mass above zero.';
  if (!(cfg.T_C>=1100 && cfg.T_C<=1450)) return 'Bath temperature must be between 1100 and 1450 °C, the range covered by the data.';
  if (!(cfg.steps>=1 && cfg.steps<=200)) return 'Use between 1 and 200 calculation steps.';
  if (!(cfg.cycle_min>0)) return 'Enter a blowing time above zero.';
  if (!(cfg.P>0)) return 'Enter a total pressure above zero.';
  for (const k in cfg.gamma) if (!(cfg.gamma[k]>0)) return 'Activity coefficients must be greater than zero.';
  return null;
}
function runNow(){
  const v = validate(); if (v){ setStatus(v,true); return; }
  try{
    const t0=performance.now();
    const r = E.simulate(cfg,false);
    const showLim = document.getElementById('showLimit').checked;
    const lim = showLim ? E.simulate(cfg,true) : null;
    const ms = performance.now()-t0;
    lastRes=r; lastLim=lim;
    const n = r.steps.length + (lim?lim.steps.length:0);
    setStatus(`${n} equilibria solved in ${F0(ms)} ms`);
    render();
  }catch(e){ console.error(e); setStatus('The calculation stopped: '+e.message+'. Check the inputs for extreme values.', true); }
}

function render(){
  const r=lastRes, lim=lastLim, s=r.summary, st=r.steps, last=st[st.length-1];
  document.getElementById('furnace').innerHTML = furnaceSVG(r,s);
  const kp = [
    [F(s.Zn_rec,1)+'%','Zinc fumed'],[F(s.Pb_rec,1)+'%','Lead fumed'],[F(s.Cd_rec,1)+'%','Cadmium fumed'],
    [F(last.Zn_slag,2)+'%','Zinc in discard slag'],[F0(s.coal_kg/cfg.slag_t)+' kg','Coal per t slag'],
    [(s.Q_GJ<0?'+':'−')+F(Math.abs(s.Q_GJ),1)+' GJ','Heat surplus (+) or deficit (−)']
  ];
  if (lim) kp.splice(1,0,[F(lim.summary.Zn_rec,1)+'%','Zinc limit at equilibrium']);
  document.getElementById('kpis').innerHTML = kp.map(([v,l])=>`<div class="kpi"><div class="v">${v}</div><div class="l">${l}</div></div>`).join('');
  const w=[];
  if (s.unconverged>0) w.push(`${s.unconverged} of ${st.length} steps did not fully converge. Try more steps or less extreme inputs.`);
  if (last.metal_kg>200) w.push(`About ${F(last.metal_kg/1000,1)} t of metal has settled (iron or Cu–Pb alloy). The bath is over-reduced; lower the coal-to-air ratio or the aluminium.`);
  if (st[0].COCO2<0.05) w.push('The bath gas is oxidising (CO/CO₂ below 0.05). Raise the coal rate or cut the blast.');
  document.getElementById('warn').innerHTML = w.map(t=>`<div class="warnbox">${uniSub(t)}</div>`).join('');

  const t = st.map(x=>x.t), zn0 = 100*E.elementIn(r.feed,'Zn','slag')*65.38/E.phaseMass(r.feed,'slag'), pb0 = 100*E.elementIn(r.feed,'Pb','slag')*207.2/E.phaseMass(r.feed,'slag');
  const ser = (res, key, start) => [[0,start]].concat(res.steps.map(x=>[+x.t.toFixed(1), x[key]]));
  const cs = document.getElementById('charts');
  cs.innerHTML = '<div class="chart" id="c1"></div><div class="chart" id="c2"></div><div class="chart" id="c3"></div><div class="chart" id="c4"></div>';
  const S1=[{name:'Model',short:'model',color:'var(--zn)',pts:ser(r,'Zn_slag',zn0)}]; if(lim) S1.push({name:'Equilibrium limit',short:'limit',color:'var(--zn)',dash:true,pts:ser(lim,'Zn_slag',zn0)});
  drawChart(document.getElementById('c1'),{title:'Zinc in slag, wt%',xlab:'Blowing time, min',xname:'t',series:S1,ymin:0,fv:v=>F(v,2)+'%'});
  const S2=[{name:'Model',short:'model',color:'var(--pb)',pts:ser(r,'Pb_slag',pb0)}]; if(lim) S2.push({name:'Equilibrium limit',short:'limit',color:'var(--pb)',dash:true,pts:ser(lim,'Pb_slag',pb0)});
  drawChart(document.getElementById('c2'),{title:'Lead in slag, wt%',xlab:'Blowing time, min',xname:'t',series:S2,ymin:0,fv:v=>F(v,3)+'%'});
  const fumeSer = res => [[0,0]].concat(res.steps.map(x=>[+x.t.toFixed(1),(x.cumZnO_kg+x.cumPbO_kg)/1000]));
  const S3=[{name:'ZnO + PbO fume',short:'model',color:'var(--ink)',pts:fumeSer(r)}]; if(lim) S3.push({name:'Equilibrium limit',short:'limit',color:'var(--ink)',dash:true,pts:fumeSer(lim)});
  drawChart(document.getElementById('c3'),{title:'Fume produced, t (cumulative)',xlab:'Blowing time, min',xname:'t',series:S3,ymin:0,fv:v=>F(v,2)+' t'});
  const S4=[{name:'CO/CO₂',short:'CO/CO₂',color:'var(--gas)',pts:r.steps.map(x=>[+x.t.toFixed(1),x.COCO2])},{name:'Zn in gas ×100, atm',short:'pZn×100',color:'var(--zn)',pts:r.steps.map(x=>[+x.t.toFixed(1),x.pZn*100])}];
  drawChart(document.getElementById('c4'),{title:'Reaction-zone gas',xlab:'Blowing time, min',xname:'t',series:S4,ymin:0,fv:v=>F(v,2)});

  renderSteps(); renderPhases(); renderEq(); renderRx(); renderData();
}

function renderSteps(){
  const r=lastRes; const rows=r.steps.map(x=>`<tr><td>${F(x.t,1)}</td><td>${F0(x.coal)}</td><td>${F0(x.al)}</td><td>${F(x.Zn_slag,2)}</td><td>${F(x.Pb_slag,3)}</td><td>${F(x.Cu_slag,2)}</td><td>${F(x.Fe3_ratio,3)}</td><td>${F(x.pZn,4)}</td><td>${F(x.COCO2,2)}</td><td>${F(x.log_pO2,2)}</td><td>${F0(x.cumZnO_kg)}</td><td>${F0(x.cumPbO_kg)}</td><td>${F0(-x.Q_MJ)}</td><td>${F0(x.metal_kg)}</td></tr>`).join('');
  document.getElementById('p-steps').innerHTML = `<p class="small" style="margin-top:0">Each step equilibrates ${F(r.fRZ*100,1)}% of the bath with ${F(r.dt,1)} min of coal, air and aluminium, then removes the gas. Slag columns are bulk bath values after the step; gas columns are the reaction-zone gas.</p>
  <div class="scroll"><table class="data"><thead><tr><th>Time, min</th><th>Coal, kg</th><th>Al, kg</th><th>Zn, %</th><th>Pb, %</th><th>Cu, %</th><th>Fe³⁺/Fe²⁺</th><th>p<sub>Zn</sub>, atm</th><th>CO/CO₂</th><th>log p<sub>O₂</sub></th><th>ZnO fume, kg</th><th>PbO fume, kg</th><th>Heat surplus, MJ</th><th>Metal, kg</th></tr></thead><tbody>${rows}</tbody></table></div>
  <p class="small">Heat surplus is the enthalpy released in the reaction zone with coal, air and aluminium entering at 25 °C and products leaving at bath temperature. A negative value means the zone needs heat and the bath would cool.</p>`;
}

function compTable(rows, cols){ return `<table class="data"><thead><tr>${cols.map(c=>`<th>${c}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table>`; }
function renderPhases(){
  const r=lastRes, s=r.summary, n=r.final, SP=E.SP;
  const nn = k => n[SP[k].i];
  const slagM = E.phaseMass(n,'slag');
  const ox = [['FeO',nn('slag:FeO')*71.844],['Fe2O3',nn('slag:FeO1.5')/2*159.687],['SiO2',nn('slag:SiO2')*60.083],['CaO',nn('slag:CaO')*56.077],['Al2O3',nn('slag:AlO1.5')/2*101.961],['MgO',nn('slag:MgO')*40.304],['ZnO',nn('slag:ZnO')*81.379],['PbO',nn('slag:PbO')*223.199],['Cu2O',nn('slag:CuO0.5')/2*143.091],['CdO',nn('slag:CdO')*128.413]];
  const feTot = nn('slag:FeO')+nn('slag:FeO1.5');
  const slagRows = ox.map(([k,m])=>[fx(k),F(100*m/slagM,3)]);
  const el = (ph, e) => E.elementIn(n,e,ph)*E.AW[e];
  const block = (title, mass, inner) => `<div class="block"><h3>${title}</h3><div class="mass">${mass}</div>${inner}</div>`;
  const phaseBlock = (ph, title, els) => { const m=E.phaseMass(n,ph); if (m<1e-3) return block(title,'Not formed',''); return block(title, `${F(m,1)} kg`, compTable(els.map(e=>[e, F(100*el(ph,e)/m,2)]), ['Element','wt%'])); };
  const fumeRows = [['ZnO',s.ZnO_kg],['PbO',s.PbO_kg],['CdO',s.CdO_kg],['SiO2 (from SiO gas)',s.SiO2_kg]].map(([k,v])=>[fx(k),F0(v),F(s.fume_kg>0?100*v/s.fume_kg:0,2)]);
  const solids = [['C(gr):C','Unburnt char',12.011],['Fe3O4(s):Fe3O4','Magnetite',231.533],['MgAl2O4(s):MgAl2O4','Spinel MgAl₂O₄',142.27],['ZnAl2O4(s):ZnAl2O4','Gahnite ZnAl₂O₄',183.34]].map(([k,l,mw])=>[uniSub(l),F0(n[SP[k].i]*mw)]);
  document.getElementById('p-phases').innerHTML = `<div class="blocks">
   ${block('Fume (as oxides)', `${F(s.fume_kg/1000,3)} t: Zn ${F(s.fume_Zn_pct,1)}%, Pb ${F(s.fume_Pb_pct,1)}%, Cd ${F(s.fume_Cd_pct,2)}%`, compTable(fumeRows,['Compound','kg','wt%']))}
   ${block('Discard slag', `${F(slagM/1000,2)} t, Fe³⁺/ΣFe ${F(100*nn('slag:FeO1.5')/feTot,1)}%`, compTable(slagRows,['Oxide','wt%']))}
   ${(()=>{ const m=E.phaseMass(n,'matte'); if(m<1e-3) return block('Matte','Not formed',''); return block('Matte', `${F(m,1)} kg, Cu ${F(100*el('matte','Cu')/m,1)}%`, compTable([['Cu2S',nn('matte:Cu2S')*159.152],['FeS',nn('matte:FeS')*87.905],['PbS',nn('matte:PbS')*239.26],['ZnS',nn('matte:ZnS')*97.44]].map(([k,v])=>[fx(k),F(100*v/m,2)]),['Compound','wt%'])); })()}
   ${phaseBlock('alloy','Iron alloy',['Fe','Cu','Si','Al','Pb'])}
   ${phaseBlock('bullion','Cu–Pb bullion',['Cu','Pb','Fe','Zn'])}
   ${block('Solid phases', 'Precipitated or left in the bath', compTable(solids,['Phase','kg']))}
   ${block('Energy and gas', 'Whole cycle', compTable([
      ['Reaction-zone heat surplus, GJ', F(-s.Q_GJ,2)],
      ['Sensible heat in bath off-gas, GJ', F(s.sens_GJ,2)],
      ['Afterburning heat in freeboard, GJ', F(s.ab_GJ,2)],
      ['Bath off-gas, Nm³', F0(s.offgas_Nm3)],
      ['Tertiary air, Nm³', F0(s.tertiary_air_Nm3)],
      ['Coal, t', F(s.coal_kg/1000,2)],['Aluminium, kg', F0(s.al_kg)]],['Quantity','Value']))}
   ${block('Metal balance', 'Feed and fume', compTable([
      ['Zn', F0(s.feedZn_kg), F0(s.Zn_kg), F(s.Zn_rec,1)],
      ['Pb', F0(s.feedPb_kg), F0(s.Pb_kg), F(s.Pb_rec,1)],
      ['Cd', F(s.feedCd_kg,1), F(s.Cd_kg,1), F(s.Cd_rec,1)]],['Metal','Feed, kg','Fumed, kg','%']))}
  </div>`;
}

function renderEq(){
  const r=lastRes; if (eqStep==null || eqStep>r.steps.length) eqStep=1;
  const st=r.steps[eqStep-1], n=st.eq.n, P=cfg.P;
  const gam = Object.assign({},E.DEFAULT_GAMMA,cfg.gamma);
  const rows=[]; const absent=[];
  E.PHASES.forEach((p,k)=>{
    if (!st.eq.active[k]) { absent.push(uniSub(p.label)); return; }
    const ids=p.sp; let N=0, M=0; ids.forEach(i=>{N+=n[i]; M+=n[i]*E.SPECIES[i].mw;});
    if (N<=0){ absent.push(uniSub(p.label)); return; }
    rows.push(`<tr class="grp"><td colspan="5">${uniSub(p.label)}: ${F(N,3)} kmol, ${F(M,1)} kg</td></tr>`);
    ids.forEach(i=>{
      const sp=E.SPECIES[i], x=n[i]/N; if (n[i]<=0) return;
      let act;
      if (p.type==='gas') act = sci(x*P)+' atm';
      else if (p.type==='pure') act = '1';
      else act = sci((gam[sp.key]||1)*x);
      rows.push(`<tr><td>${fx(sp.name)}</td><td>${sci(n[i])}</td><td>${p.type==='pure'?'–':sci(x)}</td><td>${act}</td><td>${p.type==='gas'?'–':p.type==='pure'?'–':F(gam[sp.key]||1,3)}</td></tr>`);
    });
  });
  document.getElementById('p-eq').innerHTML = `<div class="row"><label for="eqStep">Step</label><input type="range" id="eqStep" min="1" max="${r.steps.length}" value="${eqStep}"><span>${eqStep} of ${r.steps.length}, t = ${F(st.t,1)} min</span></div>
   <p class="small" style="margin-top:0">Reaction-zone equilibrium found by minimising the total Gibbs energy. log p<sub>O₂</sub> ${F(st.log_pO2,2)}, CO/CO₂ ${F(st.COCO2,2)}, H₂/H₂O ${F(st.H2H2O,2)}, ${st.iter} Newton iterations${st.converged?'':' (not fully converged)'}. Absent phases: ${absent.join(', ')||'none'}.</p>
   <div class="scroll"><table class="data"><thead><tr><th>Species</th><th>Amount, kmol</th><th>Mole fraction</th><th>Activity or pressure</th><th>γ</th></tr></thead><tbody>${rows.join('')}</tbody></table></div>`;

let sweepVar = 'al_kg';
function buildSens(){
  const opt = SWEEP.map(([k,l])=>`<option value="${k}" ${k===sweepVar?'selected':''}>${l}</option>`).join('');

    <label for="smax">to</label><input type="number" id="smax" value="${cur[3]}" style="width:90px">
    <label for="sn">points</label><input type="number" id="sn" value="9" min="2" max="25" style="width:64px">
    <button class="btn" id="srun" type="button">Run sweep</button></div>
    <p class="small" style="margin-top:0">All other inputs stay as set on the left. Each point runs a full fuming cycle.</p>

  document.getElementById('sv').addEventListener('change',e=>{ sweepVar=e.target.value; buildSens(); });
  document.getElementById('srun').addEventListener('click', runSweep);

function runSweep(){
  const a=parseFloat(document.getElementById('smin').value), b=parseFloat(document.getElementById('smax').value), np=Math.max(2,Math.min(25,parseInt(document.getElementById('sn').value)||9));
  if(!isFinite(a)||!isFinite(b)||a===b){ document.getElementById('stab').innerHTML='<p class="small">Enter two different end values.</p>'; return; }
  const btn=document.getElementById('srun'); btn.disabled=true; btn.textContent='Running…';
  setTimeout(()=>{
    const base = clone(cfg), out=[];
    for(let i=0;i<np;i++){
      const v = a+(b-a)*i/(np-1); const c = clone(base);
      const [p,q]=sweepVar.split('|'); if(q) c[p][q]=v; else c[p]=v;
      if (sweepVar==='T_C' && (v<1100||v>1450)) continue;
      try{ const r=E.simulate(c,false); out.push({v, s:r.summary, end:r.steps[r.steps.length-1]}); }catch(e){}
    }
    const lab = SWEEP.find(x=>x[0]===sweepVar)[1];
    const rv = v => +v.toPrecision(4);
    drawChart(document.getElementById('sc1'),{title:'Metal fumed, % of feed',xlab:lab,xname:'x',series:[{name:'Zinc',short:'Zn',color:'var(--zn)',pts:out.map(o=>[rv(o.v),o.s.Zn_rec])},{name:'Lead',short:'Pb',color:'var(--pb)',pts:out.map(o=>[rv(o.v),o.s.Pb_rec])}],ymin:0,fv:v=>F(v,1)+'%'});
    drawChart(document.getElementById('sc2'),{title:'Fume produced, t',xlab:lab,xname:'x',series:[{name:'Total fume',short:'fume',color:'var(--ink)',pts:out.map(o=>[rv(o.v),o.s.fume_kg/1000])}],ymin:0,fv:v=>F(v,2)+' t'});
    document.getElementById('stab').innerHTML = compTable(out.map(o=>[F(o.v,o.v<10?2:0),F(o.s.Zn_rec,1),F(o.s.Pb_rec,1),F(o.s.fume_kg/1000,3),F(o.end.Zn_slag,2),F(-o.s.Q_GJ,1),F0(o.end.metal_kg)]),[lab,'Zn fumed, %','Pb fumed, %','Fume, t','Zn in slag, %','Heat surplus, GJ','Metal, kg']);
    btn.disabled=false; btn.textContent='Run sweep';
  },30);
}

function buildAbout(){
  document.getElementById('p-about').innerHTML = `<div class="prose">
  <h3>What is calculated</h3>
  <p>The fuming cycle is split into steps. In each step a share of the bath (set by the turnover) meets that step’s coal, blast air and aluminium in the tuyere reaction zone. The model finds the equilibrium of this zone by minimising the total Gibbs energy of all phases under element balance, using the Gordon–McBride (RAND) Newton method with automatic phase addition and removal. The gas, carrying Zn, Pb, PbO, PbS and Cd vapour, leaves the bath and becomes fume after re-oxidation in the freeboard. The condensed products mix back into the bath for the next step.</p>
  <p>Because a Gibbs minimiser works with species rather than reactions, every reaction between the species below is accounted for at once: coal gasification, Boudouard, water–gas shift, reduction of Fe₂O₃, Fe₃O₄, FeO, ZnO, PbO and Cu₂O by C, CO, H₂ and Fe, aluminothermic reduction of all oxides including SiO₂, sulfide exchange between matte and slag, volatilisation of Pb, PbO, PbS and Cd, and spinel formation.</p>
  <h3>Phases and species</h3>
  <p><b>Gas</b> (ideal): CO, CO₂, H₂, H₂O, CH₄, N₂, O₂, Zn, Pb, PbO, PbS, Cd, SO₂, SO₃, S₂, H₂S, COS, SiO. <b>Slag</b> (ideal on a single-cation basis with constant activity coefficients): FeO, FeO<sub>1.5</sub>, SiO₂, CaO, AlO<sub>1.5</sub>, MgO, ZnO, PbO, CuO<sub>0.5</sub>, CdO. <b>Iron alloy</b>: Fe, Cu, Si, Al, Pb. <b>Cu–Pb bullion</b>: Cu, Pb, Fe, Zn. <b>Matte</b>: FeS, Cu₂S, PbS, ZnS. <b>Pure solids</b>: graphite, magnetite, MgAl₂O₄, ZnAl₂O₄.</p>
  <h3>Data</h3>
  <p>Most standard-state data are NASA Glenn polynomials (McBride, Zehe and Gordon, 2002). ZnO, ZnS, Cu₂S, CdO and Cd(g) are built from 298 K enthalpy and entropy with heat-capacity equations; ZnAl₂O₄ is estimated from its oxides. Two values were corrected after checking: FeO(l) and Cu₂S (see below). Adjust any species with the offsets in the data tab when you have better data.</p>
  <h3>Verification</h3>
  <p><b>Gibbs minimiser.</b> Thirteen reaction-zone equilibria were re-solved with Cantera’s VCS multiphase solver, an independent code, using identical species, phases and data. They span normal fuming, over-reduction to iron alloy, graphite saturation, oxidising blast, magnetite saturation, spinel and gahnite precipitation, no sulfur, and 1150–1400 °C. Both solvers found the same stable phases every time. Total Gibbs energies agreed to 4 × 10<sup>−10</sup> and species amounts to better than 2 parts in 10<sup>7</sup>. Element balances close to 10<sup>−14</sup>. The app’s NASA polynomial code matches Cantera’s evaluation of the same files to 10<sup>−4</sup> J/mol.</p>
  <p><b>Data.</b> Values were compared at 1100–1400 °C with SUPCRT16, NASA CEA, the CRC Handbook, HERACLES, the Reed (1971) Ellingham atlas as digitised in the ltegg/ellingham repository, and the Fe–O and Cu–S Calphad assessments in the LibreCalphad steel database. ZnO agrees within 1.3 kJ/mol of SUPCRT16 and within 1.6 kJ/mol of the Reed atlas, and ZnO + C = Zn(g) + CO reaches ΔG° = 0 at 950 °C. ZnS agrees within 0.6 kJ/mol, CdO within 1.4, Cd(g) exactly, and the oxides of Fe(III), Si, Al, Ca and Mg within about 2 kJ/mol.</p>
  <p><b>Corrections made.</b> NASA’s stoichiometric FeO is 8–11 kJ/mol more stable than real wüstite in equilibrium with iron, according to both the Calphad Fe–O assessment and the Reed atlas. The slag FeO standard state is therefore now iron-saturated liquid iron oxide, the basis used for measured FeO activities. Sources disagree on Cu₂S by 14 kJ/mol (CRC/NBS versus NASA CEA), so it now follows the Calphad assessment of Lee et al. (2007), which lies between them. ZnAl₂O₄ could not be checked and matters only for high-Al₂O₃ slags.</p>
  <p><b>Effect on results.</b> Every alternative data source moves the default zinc recovery by 1 point or less. The FeO correction mainly changes the iron chemistry: Fe³⁺/Fe²⁺ roughly doubles and metallic iron forms at a lower coal rate. Changing γ ZnO by ±25% moves zinc recovery by 3 to 4 points, and the turnover moves it more, so calibration against plant data matters far more than the remaining data uncertainty.</p>
  <h3>Limits of the model</h3>
  <p>Activity coefficients are constant, so effects such as lime raising the ZnO activity must be entered by changing γ ZnO. Kinetics enter only through the bath turnover and the share of coal reacting in the bath; calibrate both against plant zinc curves. Carbon dissolving in iron, slag carry-over into the fume, chlorides from aluminium dross, and the minor elements In, Ge, Sn, As, Sb and Bi are not modelled. The heat balance treats coal as its elements, so it ignores the small heat of formation of coal, and it reports the balance rather than predicting temperature. Results are equilibrium estimates for planning and comparison, not a substitute for plant trials.</p>
  </div>`;
}

// ---------- calibration to measured data ----------
const CAL_KEY = 'slag-fuming-calibration-v1';
const CAL_PARAMS = [['turnover',true],['gPbO',true],['gZnO',false],['coalUtil',false],['gFeO15',false]];
let calState = { text:'', keys: CAL_PARAMS.filter(p=>p[1]).map(p=>p[0]), iters:100, running:false, stop:false, result:null, synthetic:false };
try { const o = JSON.parse(localStorage.getItem(CAL_KEY)||'null'); if (o) Object.assign(calState, {text:o.text||'', keys:o.keys||calState.keys, iters:o.iters||100, synthetic:!!o.synthetic}); } catch(e){}
function saveCal(){ try{ localStorage.setItem(CAL_KEY, JSON.stringify({text:calState.text, keys:calState.keys, iters:calState.iters, synthetic:calState.synthetic})); }catch(e){} }
function parseCal(text){
  const rows=[]; const bad=[];
  text.split(/\r?\n/).forEach((line,i)=>{
    const t=line.trim(); if(!t) return;
    const parts=t.split(/[,;\t ]+/).filter(Boolean);
    const nums=parts.map(Number);
    if (nums.length<2 || nums.slice(0,2).some(v=>!isFinite(v))) { if (i>0 || isFinite(nums[0])) bad.push(i+1); return; }
    rows.push({t:nums[0], zn:nums[1], pb: (nums.length>2 && isFinite(nums[2])) ? nums[2] : null});
  });
  return {rows, bad};
}
function synthText(){
  // Synthetic test set: the model run with known parameters plus measurement noise. Not experimental data.
  const truth = clone(cfg); truth.turnover_pct_min = 1.8; truth.gamma = Object.assign({}, cfg.gamma, {'slag:ZnO':2.6,'slag:PbO':0.18});
  const r = FumeCalib.evaluate(E, truth, [], 1).curve;
  let seed=12345; const rnd=()=>{ seed=(seed*1103515245+12345)%2147483648; return seed/2147483648; };
  const gauss=()=>{ let u=0; while(u===0) u=rnd(); const v=rnd(); return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v); };
  const at=(ys,t)=>{ for(let i=1;i<r.ts.length;i++) if(t<=r.ts[i]){ const f=(t-r.ts[i-1])/(r.ts[i]-r.ts[i-1]); return ys[i-1]+f*(ys[i]-ys[i-1]); } return ys[ys.length-1]; };
  const lines=['time_min, Zn_wt%, Pb_wt%'];
  for (let t=0; t<=cfg.cycle_min+1e-9; t+=15) lines.push(`${t}, ${(at(r.zn,t)+0.08*gauss()).toFixed(2)}, ${(at(r.pb,t)+0.015*gauss()).toFixed(3)}`);
  return lines.join('\n');
}

  const P = FumeCalib.PARAMS;
  document.getElementById('p-cal').innerHTML = `

      <p class="small" id="calNote"></p>
    </div>
    <div>
      <div class="small" style="margin-bottom:4px">Parameters to fit (all other inputs come from the left panel, so set them to the conditions of the measured cycle)</div>
      ${CAL_PARAMS.map(([k])=>`<label class="chk"><input type="checkbox" data-calk="${k}" ${calState.keys.includes(k)?'checked':''}> ${fx(esc(P[k].label))}</label>`).join('')}
      <p class="note">From a single cycle, γ ZnO and the turnover trade off almost exactly, so fit only one of them unless you have data from cycles at different temperatures or coal rates.</p>
      <div class="row" style="margin-top:10px"><label for="calIt">Optimisation iterations</label><input type="number" id="calIt" min="5" max="500" step="5" value="${calState.iters}" style="width:80px"></div>
      <div class="btnrow"><button class="btn" id="calRun" type="button">Run calibration</button><button class="btn secondary" id="calStop" type="button" disabled>Stop</button><button class="btn secondary" id="calApply" type="button" disabled>Use fitted values</button></div>
    </div>
  </div>
  <div class="calstat" id="calStat" role="status" aria-live="polite"></div>

  <div id="calTab" class="scroll" style="margin-top:14px"></div>`;
  const ta = document.getElementById('calData'); ta.value = calState.text;
  ta.addEventListener('input', ()=>{ calState.text = ta.value; calState.synthetic = false; saveCal(); calNote(); });
  document.querySelectorAll('[data-calk]').forEach(c=>c.addEventListener('change',()=>{ calState.keys = CAL_PARAMS.map(p=>p[0]).filter(k=>document.querySelector(`[data-calk="${k}"]`).checked); saveCal(); }));
  document.getElementById('calIt').addEventListener('change', e=>{ const v=parseInt(e.target.value); if(v>=5&&v<=500){ calState.iters=v; saveCal(); } });
  document.getElementById('calRun').addEventListener('click', runCal);
  document.getElementById('calStop').addEventListener('click', ()=>{ calState.stop = true; });
  document.getElementById('calApply').addEventListener('click', applyCal);
  calNote();
  if (calState.result) renderCal(calState.result, true);

function calNote(){
  const el=document.getElementById('calNote');
  el.innerHTML = (calState.synthetic ? '<strong>These are synthetic test data, not measurements.</strong> They were generated by the model with turnover 1.8 %/min, γ ZnO 2.6 and γ PbO 0.18, plus random noise of 0.08% Zn and 0.015% Pb, so you can see whether the fit recovers them. ' : '') +
    `Paste plant or laboratory assays, or <button class="linkbtn" id="calSynth" type="button">load a synthetic test set</button>.`;
  document.getElementById('calSynth').addEventListener('click', ()=>{ calState.text = synthText(); calState.synthetic = true; document.getElementById('calData').value = calState.text; saveCal(); calNote(); });
}
function runCal(){
  if (calState.running) return;
  const {rows, bad} = parseCal(calState.text);
  const stat = document.getElementById('calStat');
  if (rows.length < 3) { stat.textContent = 'Enter at least three samples, each as time, Zn and optionally Pb.'; return; }
  if (bad.length) { stat.textContent = `Line ${bad.join(', ')} could not be read. Use numbers separated by commas, for example 30, 4.6, 0.71.`; return; }
  const tmax = Math.max(...rows.map(r=>r.t));
  if (tmax > cfg.cycle_min + 1e-6) { stat.textContent = `The last sample is at ${F0(tmax)} min. Set the blowing time on the left to at least that long.`; return; }
  if (!calState.keys.length) { stat.textContent = 'Tick at least one parameter to fit.'; return; }
  const v = validate(); if (v) { stat.textContent = v; return; }
  const cal = FumeCalib.makeCalibrator(E, cfg, rows, calState.keys, {});
  calState.running = true; calState.stop = false;
  document.getElementById('calRun').disabled = true; document.getElementById('calStop').disabled = false; document.getElementById('calApply').disabled = true;
  const t0 = performance.now(); let st = cal.state();
  const tick = () => {
    if (calState.stop || st.iter >= calState.iters) { finish(); return; }
    st = cal.step();
    stat.textContent = `Iteration ${st.iter} of ${calState.iters}: RMSE Zn ${F(st.rmseZn,3)} wt%` + (isFinite(st.rmsePb)?`, Pb ${F(st.rmsePb,4)} wt%`:'') + ` (${st.evals} model runs)`;
    if (st.iter % 5 === 0) renderCal(Object.assign({rows}, st), false);
    setTimeout(tick, 0);
  };
  const finish = () => {
    calState.running = false;
    document.getElementById('calRun').disabled = false; document.getElementById('calStop').disabled = true;
    stat.textContent = 'Estimating parameter uncertainty…';
    setTimeout(()=>{
      let unc = null; try { unc = FumeCalib.uncertainty(E, st.cfg, rows, calState.keys, 1); } catch(e){}
      const res = Object.assign({rows, unc, seconds:(performance.now()-t0)/1000, stopped: calState.stop}, st);
      calState.result = res; renderCal(res, true);
      document.getElementById('calApply').disabled = false;
      stat.textContent = `${res.stopped?'Stopped':'Finished'} after ${res.iter} iterations and ${res.evals} model runs in ${F(res.seconds,1)} s. RMSE Zn ${F(res.rmseZn0,3)} → ${F(res.rmseZn,3)} wt%` + (isFinite(res.rmsePb)?`, Pb ${F(res.rmsePb0,4)} → ${F(res.rmsePb,4)} wt%.`:'.');
    }, 20);
  };
  setTimeout(tick, 0);
}
function renderCal(st, final){
  const rows = st.rows, c = st.curve, c0 = st.startCurve;
  const ln = (curve, ys) => curve.ts.map((t,i)=>[+t.toFixed(1), ys[i]]);
  drawChart(document.getElementById('cc1'), {title:'Zinc in slag, wt%', xlab:'Blowing time, min', xname:'t', ymin:0, fv:v=>F(v,2)+'%', series:[
    {name:'Fitted model', short:'fitted', color:'var(--zn)', pts:ln(c,c.zn)}, {name:'Before fitting', short:'start', color:'var(--zn)', dash:true, pts:ln(c0,c0.zn)},
    {name:'Measured', color:'var(--ink)', markers:true, pts:rows.map(r=>[r.t,r.zn])}]});
  const pbRows = rows.filter(r=>r.pb!=null);
  drawChart(document.getElementById('cc2'), {title:'Lead in slag, wt%', xlab:'Blowing time, min', xname:'t', ymin:0, fv:v=>F(v,3)+'%', series:[
    {name:'Fitted model', short:'fitted', color:'var(--pb)', pts:ln(c,c.pb)}, {name:'Before fitting', short:'start', color:'var(--pb)', dash:true, pts:ln(c0,c0.pb)}].concat(pbRows.length?[{name:'Measured', color:'var(--ink)', markers:true, pts:pbRows.map(r=>[r.t,r.pb])}]:[])});
  const h = st.history;
  drawChart(document.getElementById('cc3'), {title:'Misfit by iteration (log₁₀)', xlab:'Iteration', xname:'iteration', fv:v=>F(v,2), series:[{name:'Objective, log₁₀', short:'log J', color:'var(--gas)', pts:h.map(x=>[x.iter, Math.log10(Math.max(x.J,1e-12))])}]});
  if (!final) { document.getElementById('calTab').innerHTML=''; return; }
  const unc = st.unc;
  const maxCorr = (unc && !unc.singular) ? (()=>{ let m=0, pr=null; unc.corr.forEach((r,i)=>r.forEach((v,j)=>{ if(i<j && Math.abs(v)>Math.abs(m)){ m=v; pr=[i,j]; } })); return {m, pr}; })() : null;
  const rowsHtml = st.params.map((p,i)=>`<tr><td>${fx(esc(p.label))}</td><td>${F(p.start,3)}</td><td>${F(p.value,3)}</td><td>${unc && !unc.singular ? '±'+F(100*unc.relErr[i],0)+'%' : '–'}</td></tr>`).join('');
  let msg = '';
  if (unc && unc.singular) msg = 'The fitted parameters cannot be separated with these data: different combinations fit equally well. Fit fewer parameters.';
  else if (maxCorr && maxCorr.pr && Math.abs(maxCorr.m) > 0.9) msg = `${fx(esc(st.params[maxCorr.pr[0]].label))} and ${fx(esc(st.params[maxCorr.pr[1]].label))} are strongly correlated (r = ${F(maxCorr.m,2)}), so the data cannot tell them apart. Fix one from independent data and refit the other.`;
  else if (unc) msg = 'The fitted parameters are well determined by these data (all correlations below 0.9). The uncertainties assume the parameters you did not fit are correct.';
  const noise = isFinite(st.rmseZn) ? ` A good fit has RMSE close to your assay precision.` : '';
  document.getElementById('calTab').innerHTML = `<table class="data" style="max-width:640px"><thead><tr><th>Parameter</th><th>Start</th><th>Fitted</th><th>Uncertainty (1σ)</th></tr></thead><tbody>${rowsHtml}</tbody></table>
    <p class="small" style="max-width:74ch">${msg}${noise} Predicted with the fitted values: ${F(st.summary.Zn_rec,1)}% of the zinc and ${F(st.summary.Pb_rec,1)}% of the lead fumed, ${F(st.summary.fume_kg/1000,2)} t of fume.</p>`;
}
function applyCal(){
  const st = calState.result; if (!st) return;
  st.params.forEach(p=>FumeCalib.PARAMS[p.key].set(cfg, +p.value.toPrecision(4)));
  syncInputs(); save(); updateHints(); schedule();
  document.getElementById('calStat').textContent = 'Fitted values copied to the inputs on the left; the main results now use them.';
}

// ---------- tabs ----------
document.getElementById('tabs').addEventListener('click', e=>{
  const b=e.target.closest('.tab'); if(!b) return;
  document.querySelectorAll('.tab').forEach(x=>x.setAttribute('aria-selected', x===b?'true':'false'));
  document.querySelectorAll('.panel').forEach(p=>p.hidden = p.id!=='p-'+b.dataset.tab);
});
document.getElementById('showLimit').addEventListener('change', schedule);

buildGroups(); syncInputs(); bindInputs(); updateHints(); buildSens(); buildAbout(); buildCal();
schedule();
})();
</script>
</body>
</html>
